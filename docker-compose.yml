name: arvo

# docker compose up -d                      → postgres, api, web, site
# docker compose --profile ollama up -d     → also a local Ollama LLM (large download)

x-api-url: &public-api-url ${NEXT_PUBLIC_API_URL:-http://localhost:3301}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arvo}
      POSTGRES_DB: ${POSTGRES_DB:-arvo}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arvo} -d ${POSTGRES_DB:-arvo}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: arvo-api:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-arvo}:${POSTGRES_PASSWORD:-arvo}@postgres:5432/${POSTGRES_DB:-arvo}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3300}
      STORAGE_PATH: /data/storage
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - '${API_PORT:-3301}:3301'
    volumes:
      - statement-files:/data/storage

  web:
    image: arvo-web:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: *public-api-url
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3301
    ports:
      - '${WEB_PORT:-3300}:3300'

  site:
    image: arvo-site:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: site
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3300}
    restart: unless-stopped
    ports:
      - '${SITE_PORT:-3400}:3400'

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '${OLLAMA_PORT:-11434}:11434'

volumes:
  postgres-data:
  statement-files:
  ollama-models:
